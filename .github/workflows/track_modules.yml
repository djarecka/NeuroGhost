name: Track satellite module sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sync-table:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute commit distances and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.request

          REPO   = "sensein/NeuroGhost"
          TOKEN  = os.environ["GH_TOKEN"]
          README = "README.md"

          # --------------- module definitions --------------------------------
          # kind="fork"       — a fork of sensein/NeuroGhost; we compare
          #                     sensein/NeuroGhost main...fork:repo:branch
          # kind="standalone" — an independent repo; we compare its default
          #                     branch against its own latest commit date and
          #                     report days since last commit instead of a
          #                     commit-behind count (cross-repo commit distance
          #                     is not meaningful for unrelated histories).
          MODULES = [
              {
                  "name":       "Proteus",
                  "maintainer": "@neurovium (Nema)",
                  "repo":       "neurovium/Proteus",
                  "kind":       "standalone",
                  "branch":     "main",
              },
              {
                  "name":       "Dorada",
                  "maintainer": "@djarecka",
                  "repo":       "djarecka/NeuroGhost",
                  "kind":       "fork",
                  "branch":     "djarecka:NeuroGhost:main",
              },
          ]

          def gh_get(path):
              url = f"https://api.github.com/{path.lstrip('/')}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read())

          def behind_fork(fork_branch):
              """Commits the fork is behind sensein/NeuroGhost main."""
              try:
                  data = gh_get(f"repos/{REPO}/compare/main...{fork_branch}")
                  n = data.get("behind_by", 0)
                  return "✓ up to date" if n == 0 else f"{n} commit{'s' if n != 1 else ''}"
              except Exception as e:
                  print(f"  warn: compare failed for {fork_branch}: {e}", file=sys.stderr)
                  return "—"

          def days_since_commit(repo, branch):
              """Days since last commit on a standalone repo's branch."""
              try:
                  import datetime
                  data = gh_get(f"repos/{repo}/commits/{branch}")
                  ts   = data["commit"]["committer"]["date"]   # e.g. "2025-03-01T12:00:00Z"
                  dt   = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  now  = datetime.datetime.now(datetime.timezone.utc)
                  days = (now - dt).days
                  return f"{days}d ago" if days > 0 else "today"
              except Exception as e:
                  print(f"  warn: last-commit failed for {repo}@{branch}: {e}", file=sys.stderr)
                  return "—"

          # --------------- build table rows ----------------------------------
          rows = ["| Module | Maintainer | Repository | Behind main | Compare |",
                  "|--------|-----------|------------|-------------|---------|"]

          for m in MODULES:
              repo_cell = f"[{m['repo']}](https://github.com/{m['repo']})"

              if m["kind"] == "fork":
                  behind_cell  = behind_fork(m["branch"])
                  compare_url  = f"https://github.com/{REPO}/compare/main...{m['branch']}"
                  compare_cell = f"[compare ↗]({compare_url})"
              else:
                  behind_cell  = days_since_commit(m["repo"], m["branch"])
                  compare_url  = f"https://github.com/{m['repo']}/commits/{m['branch']}"
                  compare_cell = f"[commits ↗]({compare_url})"

              rows.append(f"| {m['name']} | {m['maintainer']} | {repo_cell} | {behind_cell} | {compare_cell} |")

          table = "\n".join(rows)

          # --------------- patch README between sentinel comments ------------
          readme = open(README).read()
          updated = re.sub(
              r"<!-- MODULE_SYNC_START -->.*?<!-- MODULE_SYNC_END -->",
              f"<!-- MODULE_SYNC_START -->\n{table}\n<!-- MODULE_SYNC_END -->",
              readme,
              flags=re.DOTALL,
          )
          open(README, "w").write(updated)
          print("README updated:")
          print(table)
          PYEOF

      - name: Commit updated README (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No sync changes — nothing to commit"
          else
            git add README.md
            git commit -m "auto: update satellite module sync status [skip ci]"
            git push origin HEAD:main
          fi
