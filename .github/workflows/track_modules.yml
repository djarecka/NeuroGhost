name: Track satellite module sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sync-table:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute commit distances and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.request

          REPO   = "sensein/NeuroGhost"
          TOKEN  = os.environ["GH_TOKEN"]
          README = "README.md"

          # --------------- module definitions --------------------------------
          # kind="fork"       — a fork of sensein/NeuroGhost; we compare
          #                     sensein/NeuroGhost main...fork:repo:branch
          # kind="standalone" — an independent repo; we compare its default
          #                     branch against its own latest commit date and
          #                     report days since last commit instead of a
          #                     commit-behind count (cross-repo commit distance
          #                     is not meaningful for unrelated histories).
          MODULES = [
              {
                  "name":       "Proteus",
                  "maintainer": "@neurovium (Nema)",
                  "repo":       "neurovium/Proteus",
                  "kind":       "standalone",
                  "branch":     "main",
              },
              {
                  "name":       "Dorada",
                  "maintainer": "@djarecka",
                  "repo":       "djarecka/NeuroGhost",
                  "kind":       "fork",
                  "branch":     "djarecka:NeuroGhost:main",
              },
          ]

          def gh_get(path):
              url = f"https://api.github.com/{path.lstrip('/')}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read())

          def behind_fork(fork_branch):
              """Commits the fork is behind sensein/NeuroGhost main."""
              try:
                  data = gh_get(f"repos/{REPO}/compare/main...{fork_branch}")
                  n = data.get("behind_by", 0)
                  return "✓ up to date" if n == 0 else f"{n} commit{'s' if n != 1 else ''}"
              except Exception as e:
                  print(f"  warn: compare failed for {fork_branch}: {e}", file=sys.stderr)
                  return "—"

          def commits_ahead_of_pin(repo, branch, pin_sha):
              """
              How many commits the repo's branch has made since pin_sha.
              Used for Proteus: pin_sha is the last commit we inlined into align.py.
              """
              if not pin_sha or pin_sha == "UNSET":
                  return "⚠ pin unset"
              try:
                  data = gh_get(f"repos/{repo}/compare/{pin_sha}...{branch}")
                  n = data.get("ahead_by", 0)
                  return "✓ up to date" if n == 0 else f"{n} commit{'s' if n != 1 else ''} ahead"
              except Exception as e:
                  print(f"  warn: pin compare failed for {repo}: {e}", file=sys.stderr)
                  return "—"

          def read_proteus_pin():
              """Read the SHA from .proteus-pin."""
              try:
                  for line in open(".proteus-pin"):
                      line = line.strip()
                      if line.startswith("sha=") and not line.startswith("#"):
                          return line.split("=", 1)[1].strip()
              except Exception:
                  pass
              return "UNSET"

          # --------------- build table rows ----------------------------------
          rows = ["| Module | Maintainer | Repository | Behind main | Compare |",
                  "|--------|-----------|------------|-------------|---------|"]

          proteus_pin = read_proteus_pin()

          for m in MODULES:
              repo_cell = f"[{m['repo']}](https://github.com/{m['repo']})"

              if m["kind"] == "fork":
                  behind_cell  = behind_fork(m["branch"])
                  compare_url  = f"https://github.com/{REPO}/compare/main...{m['branch']}"
                  compare_cell = f"[compare ↗]({compare_url})"
              else:
                  # standalone (Proteus): track commits since last align.py sync
                  behind_cell  = commits_ahead_of_pin(m["repo"], m["branch"], proteus_pin)
                  compare_url  = (
                      f"https://github.com/{m['repo']}/compare/{proteus_pin}...{m['branch']}"
                      if proteus_pin != "UNSET" else
                      f"https://github.com/{m['repo']}/commits/{m['branch']}"
                  )
                  compare_cell = f"[compare ↗]({compare_url})"

              rows.append(f"| {m['name']} | {m['maintainer']} | {repo_cell} | {behind_cell} | {compare_cell} |")

          table = "\n".join(rows)

          # --------------- patch README between sentinel comments ------------
          readme = open(README).read()
          updated = re.sub(
              r"<!-- MODULE_SYNC_START -->.*?<!-- MODULE_SYNC_END -->",
              f"<!-- MODULE_SYNC_START -->\n{table}\n<!-- MODULE_SYNC_END -->",
              readme,
              flags=re.DOTALL,
          )
          open(README, "w").write(updated)
          print("README updated:")
          print(table)
          PYEOF

      - name: Commit updated README (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No sync changes — nothing to commit"
          else
            git add README.md
            git commit -m "auto: update satellite module sync status [skip ci]"
            git push origin HEAD:main
          fi
