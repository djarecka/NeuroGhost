name: Propose Mappings

# Proposes mappings between two registered schemas with the free local
# embedding model (neuro_ghost/propose_mappings.py) and opens a PR with the
# mapping set (.sssom.tsv table + .sssom.yml metadata) — every row PROPOSED,
# for review. Merging triggers the rebuild.
# Manual only.
#
# The schema dropdowns are a fixed list (GitHub requires one, and the
# workflow token can't edit workflow files): ADD A NEW SCHEMA'S SOURCE LABEL
# BELOW when it's registered (labels: data/registry.json -> sources[].label).
# "all" = every other registered schema; all + all = every pair once.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject schema"
        required: true
        default: "aind"
        type: choice
        options: [all, aind, anatomical-structure-schema, asset, bbqs, bids, dandiset, nwb, openminds, personinfo, schema.org]
      object:
        description: "Object schema"
        required: true
        default: "bids"
        type: choice
        options: [all, aind, anatomical-structure-schema, asset, bbqs, bids, dandiset, nwb, openminds, personinfo, schema.org]
      kind:
        description: "What to map"
        required: true
        default: "properties"
        type: choice
        options: [properties, classes, all]
      min_score:
        description: "Cosine cut-off"
        required: false
        default: "0.6"
        type: string

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the PR branch
      pull-requests: write   # open the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-minilm-v2
          restore-keys: hf-

      # sentence-transformers is only needed here, so it isn't in
      # requirements.txt (every rebuild would pull in PyTorch). The CPU-only
      # torch wheel avoids the multi-GB CUDA build on Linux runners.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers

      - name: Propose mappings
        id: propose
        env:
          SUBJECT: ${{ inputs.subject }}
          OBJECT: ${{ inputs.object }}
          KIND: ${{ inputs.kind }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: |
          OUT="mappings/$(date -u +%Y-%m-%d)_embeddings_${SUBJECT}__${OBJECT}_${KIND}.sssom.tsv"
          python neuro_ghost/propose_mappings.py "$SUBJECT" "$OBJECT" \
            --kind "$KIND" --min-score "$MIN_SCORE" --out "$OUT"
          python neuro_ghost/mappings.py validate "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.propose.outputs.out }}
        run: |
          BRANCH="mappings/$(basename "$OUT" .sssom.tsv)-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$OUT" "${OUT%.tsv}.yml"   # the table and its metadata file
          git commit -m "chore(mappings): propose $(basename "$OUT")"
          git push -u origin "$BRANCH"
          N=$(grep -cv '^#' "$OUT"); N=$((N - 1))
          gh pr create --base main --head "$BRANCH" \
            --title "Proposed mappings: ${{ inputs.subject }} → ${{ inputs.object }} (${{ inputs.kind }})" \
            --body "$N mapping(s) proposed by embeddings (\`all-MiniLM-L6-v2\`, cut-off ${{ inputs.min_score }}), all **PROPOSED**. Review the file: change a row's \`review_status\` to \`ACCEPTED\`/\`REJECTED\` and set \`reviewer_id\` to your GitHub login (the Mapping Check verifies it's you), or leave rows PROPOSED. Merging publishes them and triggers the rebuild."
