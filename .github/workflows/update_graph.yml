name: Update graph from meta model

on:
  push:
    branches: [main]
    paths:
      - schemas/meta_model.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN so we can push back
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate GN/GR in index.html
        run: python scripts/update_graph.py

      - name: Commit updated index.html (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.html; then
            echo "No graph changes — nothing to commit"
          else
            git add index.html
            git commit -m "auto: sync graph with meta_model.yaml [skip ci]"
            git push origin HEAD:main
          fi
