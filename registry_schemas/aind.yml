  Acquisition:
    description: 'Description of data acquisition metadata including streams, stimuli,
      and experimental setup.


      The acquisition metadata is split into two parallel pieces: the DataStream and
      the StimulusEpoch.

      At any given moment in time the active DataStream(s) represents all modalities
      of data being acquired,

      while the StimulusEpoch represents all stimuli being presented.'
    slots:
    - object_type
    - describedBy
    - schema_version
    - protocol_id
    - subject_id
    - specimen_id
    - acquisition_start_time
    - acquisition_start_tz
    - acquisition_end_time
    - experimenters
    - ethics_review_id
    - instrument_id
    - acquisition_type
    - notes
    - coordinate_system
    - calibrations
    - maintenance
    - data_streams
    - stimulus_epochs
    - manipulations
    - subject_details
    slot_usage:
      object_type: {}
      describedBy: {}
      schema_version: {}
      protocol_id:
        description: DOI for protocols.io
      subject_id:
        description: Unique identifier for the subject
        required: true
      specimen_id:
        description: Required for in vitro modalities. Standard format is {subject_id}
          with a _### suffix, as needed
      acquisition_start_time:
        description: During validation, timezone information will be moved into the
          acquisition_start_tz field.
        range: datetime
        required: true
      acquisition_start_tz:
        description: Automatically populated by a validator based on acquisition_start_time.
          Will be a TimeZoneName (IANA name) when the datetime uses a ZoneInfo timezone,
          or an integer UTC offset in hours for fixed-offset timezones. Use ZoneInfo
          (from the zoneinfo standard library) to preserve the named timezone.
        any_of:
        - range: integer
        - range: string
      acquisition_end_time:
        range: datetime
        required: true
      experimenters:
        multivalued: true
      ethics_review_id: {}
      instrument_id:
        description: Should match the Instrument.instrument_id. Required when instrument
          metadata is available.
      acquisition_type:
        description: Descriptive string detailing the type of acquisition, should
          be consistent across similar acquisitions for the same experiment.
        required: true
      notes: {}
      coordinate_system:
        description: Origin and axis definitions for determining the configured position
          of devices during acquisition. Required when coordinates are provided within
          the Acquisition
      calibrations:
        multivalued: true
      maintenance:
        range: Maintenance
        multivalued: true
      data_streams:
        required: true
        multivalued: true
      stimulus_epochs:
        range: StimulusEpoch
        multivalued: true
      manipulations:
        range: Manipulation
        multivalued: true
      subject_details:
        description: Required for in vivo acquisitions.
  Funding:
    description: Description of funding sources
    slots:
    - object_type
    - funder
    - grant_number
    - fundee
    slot_usage:
      object_type: {}
      funder:
        required: true
      grant_number: {}
